<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <meta
    name="theme-color"
    content="#0f766e"
  >

  <meta
    name="description"
    content=" Admin – Kiểm tra quyền truy cập và chuyển hướng đến hệ thống quản trị."
  >

  <title>Đang chuyển hướng – Admin</title>

  <link
    rel="icon"
    href="../assets/images/logo/favicon.ico"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="../css/main.css"
  >
</head>

<body class="admin-redirect-page">

  <main class="admin-redirect">

    <!-- BACKGROUND -->
    <div
      class="admin-redirect__background"
      aria-hidden="true"
    >
      <span class="admin-redirect__pattern"></span>
      <span class="admin-redirect__glow admin-redirect__glow--one"></span>
      <span class="admin-redirect__glow admin-redirect__glow--two"></span>
    </div>


    <!-- CARD -->
    <section
      class="admin-redirect__card"
      aria-labelledby="redirectTitle"
    >

      <!-- BRAND -->
      <a
        href="../index.html"
        class="admin-redirect__brand"
        aria-label="MediCare - Trang chủ"
      >
        <span class="admin-redirect__brand-icon">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M12 3V21M3 12H21"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            />
          </svg>
        </span>

        <span>
          <small>Admin</small>
        </span>
      </a>


      <!-- LOADER -->
      <div
        class="admin-redirect__loader"
        aria-hidden="true"
      >
        <span class="admin-redirect__loader-ring"></span>

        <span class="admin-redirect__loader-icon">
          <svg
            width="27"
            height="27"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M12 3L19 6V11C19 15.5 16.3 19.3 12 21C7.7 19.3 5 15.5 5 11V6L12 3Z"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linejoin="round"
            />

            <path
              d="M9 12L11 14L15 10"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
      </div>


      <!-- CONTENT -->
      <div class="admin-redirect__content">

        <span class="admin-redirect__eyebrow">
       Administration
        </span>

        <h1
          class="admin-redirect__title"
          id="redirectTitle"
        >
          Đang kiểm tra quyền truy cập
        </h1>

        <p
          class="admin-redirect__desc"
          id="redirectDescription"
        >
          Hệ thống đang xác minh phiên đăng nhập trước khi
          chuyển bạn đến trang quản trị.
        </p>

      </div>


      <!-- PROGRESS -->
      <div
        class="admin-redirect__progress"
        aria-hidden="true"
      >
        <span class="admin-redirect__progress-bar"></span>
      </div>


      <!-- STATUS -->
      <div
        class="admin-redirect__status"
        id="redirectStatus"
        role="status"
        aria-live="polite"
      >
        <span class="admin-redirect__status-dot"></span>
        <span>Đang xác minh tài khoản...</span>
      </div>


      <!-- FALLBACK -->
      <div class="admin-redirect__fallback">

        <span>
          Quá trình chuyển hướng mất nhiều thời gian?
        </span>

        <a
          href="dashboard.html"
          class="admin-redirect__link"
          id="manualRedirect"
        >
          Đi đến Dashboard

          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M5 12H19M14 7L19 12L14 17"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>

      </div>


      <!-- SECURITY -->
      <div class="admin-redirect__security">

        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <rect
            x="5"
            y="10"
            width="14"
            height="10"
            rx="2"
            stroke="currentColor"
            stroke-width="1.7"
          />

          <path
            d="M8 10V7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7V10"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>

        <span>
          Khu vực quản trị chỉ dành cho tài khoản được cấp quyền.
        </span>

      </div>

    </section>

  </main>


  <!-- ========================================================
       SCRIPTS
       ======================================================== -->

  <script src="../js/core/config.js"></script>
  <script src="../js/core/storage.js"></script>
  <script src="../js/core/utils.js"></script>

  <script src="../js/services/auth.service.js"></script>

  <script>
    (() => {
      'use strict';

      document.addEventListener('DOMContentLoaded', () => {
        const title =
          document.getElementById('redirectTitle');

        const description =
          document.getElementById('redirectDescription');

        const status =
          document.getElementById('redirectStatus');

        const manualLink =
          document.getElementById('manualRedirect');


        /* ================================================
           HELPERS
           ================================================ */

        const redirect = (url) => {
          try {
            if (
              typeof Utils !== 'undefined' &&
              typeof Utils.redirect === 'function'
            ) {
              Utils.redirect(url);
              return;
            }
          } catch (error) {
            console.warn('Utils.redirect error:', error);
          }

          window.location.href = url;
        };


        const setStatus = (message, type = 'loading') => {
          if (!status) return;

          status.className =
            `admin-redirect__status admin-redirect__status--${type}`;

          status.innerHTML = `
            <span class="admin-redirect__status-dot"></span>
            <span>${message}</span>
          `;
        };


        /* ================================================
           GET CURRENT USER
           ================================================ */

        let user = null;

        try {
          if (
            typeof AuthService !== 'undefined' &&
            typeof AuthService.getCurrentUser === 'function'
          ) {
            user = AuthService.getCurrentUser();
          }
        } catch (error) {
          console.error(
            'Không thể kiểm tra phiên đăng nhập:',
            error
          );
        }


        /* ================================================
           ADMIN
           ================================================ */

        if (user && user.role === 'admin') {
          if (title) {
            title.textContent =
              'Xác minh thành công';
          }

          if (description) {
            description.textContent =
              'Quyền quản trị đã được xác nhận. Bạn đang được chuyển đến Dashboard.';
          }

          setStatus(
            'Đã xác nhận quyền quản trị',
            'success'
          );

          if (manualLink) {
            manualLink.href =
              'dashboard.html';
          }

          setTimeout(() => {
            redirect('dashboard.html');
          }, 700);

          return;
        }


        /* ================================================
           NOT LOGGED IN
           ================================================ */

        if (!user) {
          if (title) {
            title.textContent =
              'Yêu cầu đăng nhập';
          }

          if (description) {
            description.textContent =
              'Bạn cần đăng nhập bằng tài khoản quản trị để truy cập khu vực này.';
          }

          setStatus(
            'Chưa có phiên đăng nhập',
            'warning'
          );

          if (manualLink) {
            manualLink.href =
              '../pages/auth/login.html';

            manualLink.innerHTML = `
              Đi đến đăng nhập

              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M5 12H19M14 7L19 12L14 17"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            `;
          }

          setTimeout(() => {
            redirect(
              '../pages/auth/login.html?redirect=../../admin/index.html'
            );
          }, 1100);

          return;
        }


        /* ================================================
           LOGGED IN BUT NOT ADMIN
           ================================================ */

        if (title) {
          title.textContent =
            'Không có quyền truy cập';
        }

        if (description) {
          description.textContent =
            'Tài khoản hiện tại không có quyền truy cập khu vực quản trị.';
        }

        setStatus(
          'Tài khoản không có quyền quản trị',
          'error'
        );

        if (manualLink) {
          manualLink.href =
            '../index.html';

          manualLink.innerHTML = `
            Quay về trang chủ

            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M19 12H5M10 7L5 12L10 17"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          `;
        }

        setTimeout(() => {
          redirect('../index.html');
        }, 1400);
      });
    })();
  </script>

</body>
</html>
