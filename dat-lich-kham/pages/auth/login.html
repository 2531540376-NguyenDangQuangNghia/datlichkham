<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Đăng nhập Bệnh viện Hàng không Việt Nam – Hệ thống đặt lịch khám trực tuyến"
  >

  <meta name="theme-color" content="#0f766e">

  <title>Đăng nhập – Bệnh viện Hàng không Việt Nam</title>

  <link rel="icon" href="../../assets/images/logo/favicon.ico">
  <link rel="stylesheet" href="../../css/main.css">
</head>

<body class="auth-page">

  <div class="auth-wrapper">

    <div class="auth-box">

      <!-- LOGO -->
      <a href="../../index.html" class="auth-box__logo">

        <svg
          width="30"
          height="30"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 21h18"></path>
          <path d="M5 21V7l7-4 7 4v14"></path>
          <path d="M9 21v-5h6v5"></path>
          <path d="M8 10h2"></path>
          <path d="M14 10h2"></path>
          <path d="M8 13h2"></path>
          <path d="M14 13h2"></path>
        </svg>

        <span>Bệnh viện Hàng không Việt Nam</span>

      </a>


      <!-- TIÊU ĐỀ -->
      <h2 class="auth-box__title">
        Đăng nhập
      </h2>

      <p class="auth-box__sub">
        Chào mừng bạn quay trở lại
      </p>


      <!-- ALERT -->
      <div
        id="alertBox"
        class="alert"
        role="alert"
        aria-live="polite"
      ></div>


      <!-- FORM -->
      <form id="loginForm" novalidate>

        <div class="form-group">

          <label for="loginEmail">
            Email
          </label>

          <input
            type="email"
            id="loginEmail"
            name="email"
            class="form-control"
            placeholder="example@email.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="loginPassword">
            Mật khẩu
          </label>

          <input
            type="password"
            id="loginPassword"
            name="password"
            class="form-control"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
            required
          >

        </div>


        <div class="form-row form-row--between">

          <label class="form-check">

            <input
              type="checkbox"
              id="rememberMe"
              name="remember"
            >

            <span>Ghi nhớ đăng nhập</span>

          </label>


          <a
            href="forgot-password.html"
            class="text-primary text-sm"
          >
            Quên mật khẩu?
          </a>

        </div>


        <button
          type="submit"
          class="btn btn--primary btn--block"
        >
          Đăng nhập
        </button>

      </form>


      <!-- FOOTER -->
      <p class="auth-box__footer">

        Chưa có tài khoản?

        <a href="register.html">
          Đăng ký ngay
        </a>

      </p>


      <!-- TÀI KHOẢN DEMO -->
      <div class="auth-box__demo">

        <p class="text-xs text-gray">
          <strong>Tài khoản demo</strong>
        </p>

        <p class="text-xs text-gray">
          <strong>Quản trị viên:</strong>
          <code>admin@clinic.vn</code>
          /
          <code>admin123</code>
        </p>

        <p class="text-xs text-gray">
          <strong>Người dùng:</strong>
          <code>user@clinic.vn</code>
          /
          <code>user123</code>
        </p>

      </div>

    </div>

  </div>


  <!-- SCRIPTS -->

  <!-- Core -->
  <script src="../../js/core/config.js"></script>
  <script src="../../js/core/storage.js"></script>
  <script src="../../js/core/utils.js"></script>
  <script src="../../js/core/validator.js"></script>

  <!-- Data -->
  <script src="../../js/data/specialties.js"></script>
  <script src="../../js/data/doctors.js"></script>
  <script src="../../js/data/seed.js"></script>

  <!-- Services -->
  <script src="../../js/services/auth.service.js"></script>

  <!-- Page -->
  <script src="../../js/pages/auth.js"></script>

  <!-- App -->
  <script src="../../js/app.js"></script>

</body>
</html>
