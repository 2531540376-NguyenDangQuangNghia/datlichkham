<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Quên mật khẩu – Khôi phục tài khoản Bệnh viện Hàng không Việt Nam"
  >

  <meta name="theme-color" content="#0f766e">

  <title>Quên mật khẩu – Bệnh viện Hàng không Việt Nam</title>

  <link rel="icon" href="../../assets/images/logo/favicon.ico">
  <link rel="stylesheet" href="../../css/main.css">
</head>

<body class="auth-page">

  <div class="auth-wrapper">

    <div class="auth-box">

      <!-- LOGO -->
      <a href="../../index.html" class="auth-box__logo">

        <svg
          width="30"
          height="30"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 21h18"></path>
          <path d="M5 21V7l7-4 7 4v14"></path>
          <path d="M9 21v-5h6v5"></path>
          <path d="M8 10h2"></path>
          <path d="M14 10h2"></path>
          <path d="M8 13h2"></path>
          <path d="M14 13h2"></path>
        </svg>

        <span>Bệnh viện Hàng không Việt Nam</span>

      </a>


      <!-- TIÊU ĐỀ -->
      <h2 class="auth-box__title">
        Quên mật khẩu
      </h2>

      <p class="auth-box__sub">
        Nhập email đã đăng ký, chúng tôi sẽ hỗ trợ bạn khôi phục tài khoản.
      </p>


      <!-- ALERT -->
      <div
        id="alertBox"
        class="alert"
        role="alert"
        aria-live="polite"
      ></div>


      <!-- FORM -->
      <form id="forgotForm" novalidate>

        <div class="form-group">

          <label for="forgotEmail">
            Email đã đăng ký
          </label>

          <input
            type="email"
            id="forgotEmail"
            name="email"
            class="form-control"
            placeholder="example@email.com"
            autocomplete="email"
            required
          >

        </div>


        <button
          type="submit"
          class="btn btn--primary btn--block"
        >
          Gửi yêu cầu khôi phục
        </button>

      </form>


      <!-- HƯỚNG DẪN -->
      <div class="auth-box__hint">

        <div
          style="
            display:flex;
            align-items:flex-start;
            gap:10px;
          "
        >

          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            style="
              flex:0 0 auto;
              margin-top:1px;
            "
          >
            <circle cx="12" cy="12" r="9"></circle>
            <line x1="12" y1="11" x2="12" y2="16"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>

          <p
            class="text-xs text-gray"
            style="margin:0"
          >
            <strong>Lưu ý:</strong>
            Đây là phiên bản demo. Hệ thống sẽ hiển thị thông tin
            khôi phục trực tiếp trên màn hình thay vì gửi email.
          </p>

        </div>

      </div>


      <!-- FOOTER -->
      <p class="auth-box__footer">

        <a href="login.html">

          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            style="vertical-align:-2px; margin-right:4px;"
          >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>

          Quay lại đăng nhập

        </a>

      </p>

    </div>

  </div>


  <!-- SCRIPTS -->

  <!-- Core -->
  <script src="../../js/core/config.js"></script>
  <script src="../../js/core/storage.js"></script>
  <script src="../../js/core/utils.js"></script>
  <script src="../../js/core/validator.js"></script>

  <!-- Data -->
  <script src="../../js/data/specialties.js"></script>
  <script src="../../js/data/doctors.js"></script>
  <script src="../../js/data/seed.js"></script>

  <!-- Services -->
  <script src="../../js/services/auth.service.js"></script>

  <!-- Page -->
  <script src="../../js/pages/auth.js"></script>

  <!-- App -->
  <script src="../../js/app.js"></script>

</body>
</html>
